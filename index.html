<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css">
    <title>Sign In - Magic Cinema</title>
</head>

<body class="auth-body">
    <!-- Background Animation -->
    <div class="auth-background">
        <div class="floating-elements">
            <div class="floating-element"></div>
            <div class="floating-element"></div>
            <div class="floating-element"></div>
            <div class="floating-element"></div>
            <div class="floating-element"></div>
        </div>
    </div>

    <!-- Navigation -->
    <header class="auth-header">
        <a href="home.html" class="logo">
            <i class='bx bxs-movie'></i> Magic Cinema
        </a>
        <a href="home.html" class="back-btn">
            <i class='bx bx-arrow-back'></i> Back to Home
        </a>
    </header>

    <!-- Main Authentication Container -->
    <main class="auth-container">
        <div class="auth-wrapper">
            <!-- Logo Section -->
            <div class="auth-logo">
                <div class="logo-icon">
                    <i class='bx bxs-movie'></i>
                </div>
                <h1>Magic Cinema</h1>
                <p>Your Gateway to Cinematic Adventures</p>
            </div>

            <!-- Authentication Forms -->
            <div class="auth-forms">
                <!-- Toggle Buttons -->
                <div class="auth-toggle">
                    <button class="toggle-btn active" data-form="login">Sign In</button>
                    <button class="toggle-btn" data-form="signup">Sign Up</button>
                </div>

                <!-- Login Form -->
                <form class="auth-form active" id="loginForm">
                    <div class="form-header">
                        <h2>Welcome Back</h2>
                        <p>Sign in to continue your cinematic journey</p>
                    </div>

                    <div class="form-group">
                        <label for="loginEmail">Email Address</label>
                        <div class="input-wrapper">
                            <i class='bx bx-envelope'></i>
                            <input type="email" id="loginEmail" name="email" placeholder="Enter your email" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <div class="input-wrapper">
                            <i class='bx bx-lock-alt'></i>
                            <input type="password" id="loginPassword" name="password" placeholder="Enter your password" required>
                            <button type="button" class="toggle-password" data-target="loginPassword">
                                <i class='bx bx-show'></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-wrapper">
                            <input type="checkbox" id="rememberMe">
                            <span class="checkmark"></span>
                            Remember me
                        </label>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>

                    <button type="submit" class="auth-btn">
                        <span>Sign In</span>
                        <i class='bx bx-right-arrow-alt'></i>
                    </button>

                    <div class="social-login">
                        <p>Or continue with</p>
                        <div class="social-buttons">
                            <button type="button" class="social-btn google">
                                <i class='bx bxl-google'></i>
                                Google
                            </button>
                            <button type="button" class="social-btn facebook">
                                <i class='bx bxl-facebook'></i>
                                Facebook
                            </button>
                        </div>
                    </div>
                </form>

                <!-- Sign Up Form -->
                <form class="auth-form" id="signupForm">
                    <div class="form-header">
                        <h2>Join Magic Cinema</h2>
                        <p>Create your account and start exploring</p>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName">First Name</label>
                            <div class="input-wrapper">
                                <i class='bx bx-user'></i>
                                <input type="text" id="firstName" name="firstName" placeholder="First name" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="lastName">Last Name</label>
                            <div class="input-wrapper">
                                <i class='bx bx-user'></i>
                                <input type="text" id="lastName" name="lastName" placeholder="Last name" required>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="signupEmail">Email Address</label>
                        <div class="input-wrapper">
                            <i class='bx bx-envelope'></i>
                            <input type="email" id="signupEmail" name="email" placeholder="Enter your email" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="signupPassword">Password</label>
                        <div class="input-wrapper">
                            <i class='bx bx-lock-alt'></i>
                            <input type="password" id="signupPassword" name="password" placeholder="Create a password" required>
                            <button type="button" class="toggle-password" data-target="signupPassword">
                                <i class='bx bx-show'></i>
                            </button>
                        </div>
                        <div class="password-strength">
                            <div class="strength-bar">
                                <div class="strength-fill"></div>
                            </div>
                            <span class="strength-text">Password strength</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="input-wrapper">
                            <i class='bx bx-lock-alt'></i>
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="checkbox-wrapper">
                            <input type="checkbox" id="agreeTerms" required>
                            <span class="checkmark"></span>
                            I agree to the <a href="#" class="terms-link">Terms of Service</a> and <a href="#" class="terms-link">Privacy Policy</a>
                        </label>
                    </div>

                    <button type="submit" class="auth-btn">
                        <span>Create Account</span>
                        <i class='bx bx-right-arrow-alt'></i>
                    </button>

                    <div class="social-login">
                        <p>Or continue with</p>
                        <div class="social-buttons">
                            <button type="button" class="social-btn google">
                                <i class='bx bxl-google'></i>
                                Google
                            </button>
                            <button type="button" class="social-btn facebook">
                                <i class='bx bxl-facebook'></i>
                                Facebook
                            </button>
                        </div>
                    </div>
                </form>
            </div>
    </main>

    <!-- Toast Notifications -->
    <div class="toast" id="toast">
        <div class="toast-content">
            <i class="toast-icon"></i>
            <span class="toast-message"></span>
        </div>
        <button class="toast-close">&times;</button>
    </div>

    <script src="auth.js"></script>
</body>

</html>
